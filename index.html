<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de Javascript</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/scripts.js" defer></script>
</head>
<body>
    <h1>Treinando multiplicação</h1>
    <form id="form-multiplicacao">
        <label for="number">Número: </label>
        <input type="number" placeholder="1" id="number" class="numeros" required>

        <label for="multiplicacao">Multiplicar por: </label>
        <input type="number" id="multiplicacao" placeholder="10" class="numeros" required>

        <input type="submit" value="Enviar" id="button-enviar">
    </form>

    <div id="tabela-resultados">
        <h2>Tabela da multiplicação</h2>
        <p>Informe o número para calcular uma tabuada.</p>
    </div>
    
</body>
</html>
